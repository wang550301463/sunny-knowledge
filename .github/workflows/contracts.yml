name: Versioned service contracts
on:
  pull_request:
  push:
    branches: [main, master, 'codex/**']
permissions:
  contents: read
concurrency:
  group: contracts-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12.12'
      - uses: actions/setup-go@v5.5.0
        with:
          go-version: '1.24.7'
          cache-dependency-path: services/go/go.sum
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '20.20.2'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked generators and test dependencies
        run: |
          python -m pip install uv==0.8.17
          uv sync --project services/python --all-extras --frozen
          npm ci --prefix web --ignore-scripts --no-audit --no-fund
      - name: Check generated drift and real serialization boundaries
        run: services/python/.venv/bin/python knowledge-docker/scripts/contract_verify.py
