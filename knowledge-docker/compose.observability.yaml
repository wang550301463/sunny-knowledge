services:
  knowledge:
    environment:
      METRICS_PORT: '9090'
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.135.0
    command: [--config=/etc/otelcol/config.yaml]
    volumes:
      - ./observability/collector.yaml:/etc/otelcol/config.yaml:ro
    mem_limit: 384m
    restart: unless-stopped
    networks: [backend]
  tempo:
    image: grafana/tempo:2.8.2
    command: [-config.file=/etc/tempo.yaml]
    user: '0:0'
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    restart: unless-stopped
    networks: [backend]
  prometheus:
    image: prom/prometheus:v3.5.0
    command: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.retention.time=7d]
    volumes:
      - ./observability/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped
    networks: [backend]
  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?run init.py}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: 'false'
    volumes:
      - ./observability/grafana/datasources.yaml:/etc/grafana/provisioning/datasources/knowledge.yaml:ro
      - ./observability/grafana/dashboards.yaml:/etc/grafana/provisioning/dashboards/knowledge.yaml:ro
      - ./observability/grafana/knowledge.json:/etc/grafana/knowledge-dashboards/knowledge.json:ro
      - grafana-data:/var/lib/grafana
    ports:
      - 127.0.0.1:${GRAFANA_PORT:-13039}:3000
    restart: unless-stopped
    networks: [backend]
volumes:
  tempo-data:
  prometheus-data:
  grafana-data:
