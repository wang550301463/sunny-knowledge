# New isolated Chat provider: no shared Graph fixture state or retrieval configuration changes.
# The operator must separately enable LLM_ALLOW_HTTP_PROVIDERS for the bounded test window.
services:
  onboarding-model-provider:
    image: sunny-knowledge/regression:v2-local
    profiles: [test]
    command: [python, /fixture/server.py]
    volumes:
      - ./tests/agent_provider:/fixture:ro
    networks: [backend]
    read_only: true
    tmpfs: [/tmp]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 3s
      timeout: 3s
      retries: 20
  web-onboarding-regression:
    image: sunny-knowledge/web-regression:v2-local
    profiles: [test]
    init: true
    shm_size: 1gb
    command: [npx, playwright, test, --config=/tests/web_onboarding/playwright.config.js]
    networks: [backend]
    volumes:
      - ./.local/test-env.json:/run/knowledge/test-env.json:ro
      - ./tests/web:/tests/web:ro
      - ./tests/web_agent:/tests/web_agent:ro
      - ./tests/web_onboarding:/tests/web_onboarding:ro
      - ./artifacts:/artifacts
