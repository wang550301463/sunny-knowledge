global:
  scrape_interval: 5s
  evaluation_interval: 15s
scrape_configs:
  - job_name: knowledge-services
    static_configs:
      - targets: [knowledge:9090, ingest:9090, retrieval:9090, llm:9090, graphiti:9090, agent:9090, mcp:9090, gateway:9090, iam:9090, auth:9090, channel:9090]
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
